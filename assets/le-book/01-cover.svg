<rect x="-10" y="-10" width="660" height="280" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>Quill, a fountain pen, says: I wrote it in English, beside a page with a rule about a valid withdrawal. Mind says: and I can run it. Checker, holding a magnifying glass, says: checked.</title>
        <path class="ln thin" d="M20 230 L620 230" stroke-dasharray="2 9"/>
        <use href="#quill" x="14" y="80" width="130" height="152"/>
        <g transform="translate(140 112) rotate(-3)">
          <rect class="paperf" x="0" y="0" width="226" height="96" rx="3"/>
          <text class="mono" x="12" y="24" font-size="13">the withdrawal from</text>
          <text class="mono" x="12" y="42" font-size="13">a contract is valid</text>
          <text class="mono" x="22" y="60" font-size="13">if the consumer withdrew</text>
          <text class="mono" x="22" y="78" font-size="13">before the period ends.</text>
        </g>
        <use href="#mind" x="358" y="80" width="130" height="152"/>
        <use href="#checker" x="500" y="80" width="130" height="152"/>
        <circle class="ln" cx="512" cy="152" r="22"/><path class="ln" d="M496 168 L478 188"/>
        <path class="paperf" d="M14 10 L200 10 Q210 10 210 20 L210 50 Q210 60 200 60 L94 60 L80 86 L72 60 L14 60 Q4 60 4 50 L4 20 Q4 10 14 10 Z"/>
        <text class="hand" x="107" y="40.666666666666664" font-size="17" text-anchor="middle">I wrote it in English.</text>
        <path class="paperf" d="M250 10 L408 10 Q418 10 418 20 L418 50 Q418 60 408 60 L406 60 L410 86 L384 60 L250 60 Q240 60 240 50 L240 20 Q240 10 250 10 Z"/>
        <text class="hand" x="329" y="40.666666666666664" font-size="17" text-anchor="middle">And I can run it.</text>
        <path class="paperf" d="M480 10 L610 10 Q620 10 620 20 L620 50 Q620 60 610 60 L574 60 L560 86 L552 60 L480 60 Q470 60 470 50 L470 20 Q470 10 480 10 Z"/>
        <text class="handok" x="545" y="43.666666666666664" font-size="26" text-anchor="middle">Checked!</text>
      </svg>
