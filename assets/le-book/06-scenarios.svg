<rect x="-10" y="-10" width="660" height="270" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>Quill holds a clipboard titled scenario web shop. Three lines carry green ticks: periods as expected, valid as expected, late as expected. A fourth line is red: withheld not as expected. Mind points at it and says: one answer changed, look here.</title>
        <path class="ln thin" d="M20 240 L620 240" stroke-dasharray="2 9"/>
        <use href="#quill" x="20" y="90" width="130" height="152"/>
        <rect fill="#f3d697" stroke="#1d2a44" stroke-width="3" stroke-linejoin="round" x="160" y="40" width="270" height="190" rx="6"/>
        <rect class="paperf" x="174" y="62" width="242" height="156" rx="3"/>
        <rect class="inkf" x="260" y="30" width="70" height="20" rx="4"/>
        <text class="hand" x="188" y="88" font-size="18">scenario web shop</text>
        <path class="okl" d="M190 112 L198 120 L212 104"/><text class="hand" x="222" y="120" font-size="16">periods: as expected</text>
        <path class="okl" d="M190 140 L198 148 L212 132"/><text class="hand" x="222" y="148" font-size="16">valid: as expected</text>
        <path class="okl" d="M190 168 L198 176 L212 160"/><text class="hand" x="222" y="176" font-size="16">late: as expected</text>
        <path class="nol" d="M192 190 L210 206 M210 190 L192 206"/><text class="handno" x="222" y="204" font-size="16">withheld: not as expected</text>
        <path class="ln" d="M500 170 L432 196"/>
