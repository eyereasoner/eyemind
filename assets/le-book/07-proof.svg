<rect x="-10" y="-10" width="660" height="250" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>A card of Logical English goes through an arrow marked compile to a card of LS, then through an arrow marked prove to a page marked proof. Checker reads it with a magnifying glass and says: checked, against the compiled program.</title>
        <path class="ln thin" d="M20 220 L620 220" stroke-dasharray="2 9"/>
        <rect class="paperf" x="20" y="100" width="150" height="90" rx="4" style="fill: #c7dbff"/>
        <text class="hand" x="30" y="92" font-size="15">Logical English</text>
        <text class="mono" x="30" y="126" font-size="13">the withdrawal</text><text class="mono" x="30" y="144" font-size="13">from a contract</text><text class="mono" x="30" y="162" font-size="13">is valid if ...</text>
        <path class="ln" d="M176 146 L222 146 M210 136 L222 146 L210 156"/><text class="hand" x="199" y="124" font-size="12" text-anchor="middle">compile</text>
        <rect class="paperf" x="228" y="100" width="150" height="90" rx="4"/>
        <text class="hand" x="238" y="92" font-size="15">Logic Script</text>
        <text class="mono" x="238" y="126" font-size="12">implied_by(</text><text class="mono" x="246" y="144" font-size="12">is_valid(S, C),</text><text class="mono" x="246" y="162" font-size="12">[withdrew(...),</text><text class="mono" x="246" y="180" font-size="12"> ends_on(...)])</text>
        <path class="ln" d="M384 146 L430 146 M418 136 L430 146 L418 156"/><text class="hand" x="407" y="124" font-size="12" text-anchor="middle">prove</text>
        <g transform="translate(436 108) rotate(-4)">
          <rect fill="#f7c5a9" stroke="#1d2a44" stroke-width="3" stroke-linejoin="round" x="0" y="0" width="86" height="80" rx="3"/>
          <path class="ln thin" d="M12 20 L74 20 M12 34 L74 34 M12 48 L60 48 M12 62 L70 62"/>
          <text class="hand" x="43" y="-8" font-size="15" text-anchor="middle">proof</text>
        </g>
        <use href="#checker" x="526" y="80" width="110" height="128"/>
        <circle class="ln" cx="530" cy="150" r="18"/><path class="ln" d="M517 163 L504 178"/>
        <path class="paperf" d="M386 6 L620 6 Q630 6 630 16 L630 56 Q630 66 620 66 L604 66 L590 84 L582 66 L386 66 Q376 66 376 56 L376 16 Q376 6 386 6 Z"/>
        <text class="handok" x="503" y="42" font-size="18" text-anchor="middle"></text>
        <text class="handok" x="503" y="32" font-size="20" text-anchor="middle">Checked,</text>
        <text class="hand" x="503" y="54" font-size="15" text-anchor="middle">against the compiled program.</text>
      </svg>
