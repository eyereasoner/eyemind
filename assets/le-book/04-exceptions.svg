<rect x="-10" y="-10" width="660" height="270" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>A gate marked: right of withdrawal, with three padlocks labelled 16(a) performed, 16(c) personalised and 16(e) unsealed. Above Mind, a checklist for the jacket order reads: performed? no. Personalised? no. Unsealed? no. So the period runs. Beside the gate, an engraved ring sits in a box with a red tag: 16(c).</title>
        <path class="ln thin" d="M20 240 L620 240" stroke-dasharray="2 9"/>
        <path class="ln" d="M30 240 L30 60 M290 240 L290 60 M30 112 L290 112 M30 214 L290 214"/>
        <rect class="hif" x="50" y="44" width="220" height="34" rx="4"/>
        <text class="hand" x="160" y="68" font-size="19" text-anchor="middle">right of withdrawal</text>
        <path class="ln thin" d="M66 124 Q76 104 86 124"/><rect class="hif" x="58" y="122" width="36" height="28" rx="3"/>
          <rect class="paperf" x="38" y="160" width="76" height="40" rx="3"/>
          <text class="hand" x="76" y="177" font-size="14" text-anchor="middle">16(a)</text><text class="hand" x="76" y="194" font-size="12" text-anchor="middle">performed</text><path class="ln thin" d="M150 124 Q160 104 170 124"/><rect class="hif" x="142" y="122" width="36" height="28" rx="3"/>
          <rect class="paperf" x="122" y="160" width="76" height="40" rx="3"/>
          <text class="hand" x="160" y="177" font-size="14" text-anchor="middle">16(c)</text><text class="hand" x="160" y="194" font-size="12" text-anchor="middle">personalised</text><path class="ln thin" d="M234 124 Q244 104 254 124"/><rect class="hif" x="226" y="122" width="36" height="28" rx="3"/>
          <rect class="paperf" x="206" y="160" width="76" height="40" rx="3"/>
          <text class="hand" x="244" y="177" font-size="14" text-anchor="middle">16(e)</text><text class="hand" x="244" y="194" font-size="12" text-anchor="middle">unsealed</text>
        <text class="hand" x="312" y="146" font-size="14">engraved ring</text>
        <rect class="paperf" x="312" y="156" width="70" height="56" rx="4" style="fill: #f7c5a9"/>
        <circle class="ln" cx="347" cy="182" r="10"/><path class="ln thin" d="M347 172 L347 166"/>
        <path class="nol" d="M376 204 L392 222 L404 222"/><text class="handno" x="408" y="228" font-size="16">16(c)</text>
        <rect class="paperf" x="420" y="12" width="200" height="134" rx="4"/>
        <text class="hand" x="434" y="40" font-size="16">the jacket order</text>
        <text class="hand" x="434" y="64" font-size="15">performed?</text><text class="handok" x="574" y="64" font-size="15">no</text>
        <text class="hand" x="434" y="86" font-size="15">personalised?</text><text class="handok" x="574" y="86" font-size="15">no</text>
        <text class="hand" x="434" y="108" font-size="15">unsealed?</text><text class="handok" x="574" y="108" font-size="15">no</text>
        <text class="handok" x="434" y="134" font-size="16">so the period runs</text>
        <use href="#mind" x="500" y="152" width="80" height="93"/>
      </svg>
