<rect x="-10" y="-10" width="660" height="280" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>Chatty, a speech-bubble robot, says: trust me. Mind, holding a proof, says: check me. Between them a conveyor belt carries a rule in plain English to Mind and a proof onward to Checker.</title>
        <path class="ln thin" d="M20 236 L620 236" stroke-dasharray="2 9"/>
        <use href="#chatty" x="20" y="80" width="140" height="140"/>
        <path class="paperf" d="M20 14 L150 14 Q160 14 160 24 L160 52 Q160 62 150 62 L90 62 L80 76 L80 62 L30 62 Q20 62 20 52 L20 24 Q20 14 30 14 Z"/>
        <text class="hand" x="90" y="46" font-size="22" text-anchor="middle">Trust me!</text>
        <path class="ln" d="M160 206 L250 206"/><path class="ln" d="M238 196 L250 206 L238 216"/>
        <rect class="skyf" x="170" y="160" width="74" height="36" rx="3"/><text class="hand" x="207" y="184" font-size="15" text-anchor="middle">a rule</text>
        <use href="#mind" x="258" y="96" width="110" height="128"/>
        <path class="paperf" d="M246 14 L380 14 Q390 14 390 24 L390 52 Q390 62 380 62 L330 62 L318 76 L318 62 L256 62 Q246 62 246 52 L246 24 Q246 14 256 14 Z"/>
        <text class="hand" x="318" y="46" font-size="22" text-anchor="middle">Check me.</text>
        <path class="ln" d="M380 206 L470 206"/><path class="ln" d="M458 196 L470 206 L458 216"/>
        <rect fill="#f7c5a9" stroke="#1d2a44" stroke-width="3" stroke-linejoin="round" x="390" y="160" width="74" height="36" rx="3"/><text class="hand" x="427" y="184" font-size="15" text-anchor="middle">a proof</text>
        <use href="#checker" x="480" y="96" width="110" height="128"/>
        <g transform="translate(520 30) rotate(-8)"><rect class="okl" x="0" y="0" width="110" height="40" rx="4"/><text class="handok" x="55" y="29" font-size="24" text-anchor="middle">CHECKED</text></g>
      </svg>
