<rect x="-10" y="-10" width="660" height="240" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>Mind stands between a filing cabinet with one drawer pulled open and a checklist asking: overdue books? Drawer 1, none; drawer 2, none; drawer 3, none; so none at all.</title>
        <rect class="paperf" x="60" y="30" width="170" height="180" rx="4"/>
        <g>
          <rect class="paperf" x="72" y="42" width="146" height="44" rx="3"/><path class="ln" d="M130 64 L160 64"/>
          <rect class="paperf" x="72" y="98" width="146" height="44" rx="3"/><path class="ln" d="M130 120 L160 120"/>
          <rect class="skyf" x="96" y="160" width="146" height="44" rx="3"/><path class="ln" d="M154 182 L184 182"/>
        </g>
        <use href="#mind" x="270" y="70" width="110" height="128"/>
        <rect class="paperf" x="410" y="36" width="190" height="160" rx="4"/>
        <text class="hand" x="505" y="66" font-size="20" text-anchor="middle">overdue books?</text>
        <g font-size="18">
          <path class="okl" d="M428 92 L436 100 L450 84"/><text class="hand" x="460" y="100">drawer 1: none</text>
          <path class="okl" d="M428 124 L436 132 L450 116"/><text class="hand" x="460" y="132">drawer 2: none</text>
          <path class="okl" d="M428 156 L436 164 L450 148"/><text class="hand" x="460" y="164">drawer 3: none</text>
        </g>
        <text class="hand" x="505" y="188" font-size="17" text-anchor="middle">so: none at all</text>
      </svg>
