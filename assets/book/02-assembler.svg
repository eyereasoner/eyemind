<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 664 324" width="664" height="324" role="img">
<style>
  .ln { fill: none; stroke: #1d2a44; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .thin { stroke-width: 2; }
  .inkf { fill: #1d2a44; }
  .paperf { fill: #ffffff; stroke: #1d2a44; stroke-width: 3; stroke-linejoin: round; }
