        <text class="mono" x="320" y="219" font-size="15" text-anchor="middle" font-weight="600">LS</text>
        <path class="ln" d="M362 213 L420 213 L420 213"/><path class="ln" d="M408 203 L420 213 L408 223"/>
        <use href="#mind" x="430" y="160" width="100" height="117"/>
