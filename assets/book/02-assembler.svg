<rect x="-10" y="-10" width="660" height="320" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>Speech bubbles labelled N3, SPARQL RL, Logical English, OWL 2 RL, SHACL, SKOS, QUDT and ODRL pour into a funnel that becomes a single strip of LS code entering Mind.</title>
        <g font-size="19">
          <rect class="skyf" x="14" y="16" width="64" height="40" rx="18"/><text class="hand" x="46" y="43" text-anchor="middle">N3</text>
          <rect class="skyf" x="92" y="8" width="118" height="40" rx="18"/><text class="hand" x="151" y="35" text-anchor="middle">SPARQL RL</text>
          <rect class="skyf" x="224" y="16" width="160" height="40" rx="18"/><text class="hand" x="304" y="43" text-anchor="middle">Logical English</text>
          <rect class="skyf" x="398" y="8" width="106" height="40" rx="18"/><text class="hand" x="451" y="35" text-anchor="middle">OWL 2 RL</text>
          <rect class="skyf" x="518" y="16" width="86" height="40" rx="18"/><text class="hand" x="561" y="43" text-anchor="middle">SHACL</text>
          <rect class="skyf" x="70" y="66" width="76" height="38" rx="18"/><text class="hand" x="108" y="92" text-anchor="middle">SKOS</text>
          <rect class="skyf" x="420" y="66" width="80" height="38" rx="18"/><text class="hand" x="460" y="92" text-anchor="middle">QUDT</text>
          <rect class="skyf" x="514" y="66" width="80" height="38" rx="18"/><text class="hand" x="554" y="92" text-anchor="middle">ODRL</text>
