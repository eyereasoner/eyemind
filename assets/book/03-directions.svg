  </defs>
<rect x="-10" y="-10" width="660" height="240" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>Two paths through a little garden of facts. On the left, Mind walks forward from the facts toward conclusions. On the right, Mind walks backward from a question mark toward the facts it needs.</title>
        <g>
          <rect class="paperf" x="20" y="150" width="70" height="40" rx="6"/><text class="hand" x="55" y="177" font-size="18" text-anchor="middle">fact</text>
          <rect class="paperf" x="20" y="96" width="70" height="40" rx="6"/><text class="hand" x="55" y="123" font-size="18" text-anchor="middle">fact</text>
          <path class="ln" d="M96 140 L170 110"/><path class="ln" d="M158 104 L170 110 L162 122"/>
          <rect class="hif" x="176" y="84" width="104" height="44" rx="6"/><text class="hand" x="228" y="113" font-size="18" text-anchor="middle">conclusion</text>
          <use href="#mind" x="110" y="10" width="64" height="75"/>
          <text class="hand" x="150" y="210" font-size="20" text-anchor="middle">forward: what follows?</text>
        </g>
        <path class="ln thin" d="M320 20 L320 200" stroke-dasharray="3 8"/>
        <g>
          <circle class="hif" cx="600" cy="106" r="24"/><text class="hand" x="600" y="116" font-size="28" text-anchor="middle">?</text>
          <path class="ln" d="M570 106 L480 132"/><path class="ln" d="M492 124 L480 132 L494 140"/>
          <rect class="paperf" x="400" y="118" width="72" height="40" rx="6"/><text class="hand" x="436" y="145" font-size="18" text-anchor="middle">fact</text>
          <use href="#mind" x="470" y="10" width="64" height="75"/>
          <text class="hand" x="490" y="210" font-size="20" text-anchor="middle">backward: what would answer this?</text>
        </g>
      </svg>
