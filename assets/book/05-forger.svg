  </defs>
<rect x="-10" y="-10" width="660" height="250" rx="6" fill="#ffffff" stroke="#1d2a44" stroke-width="2.5"/>
        <title>A shady character in a hat slides a proof onto Checker's desk. The proof claims Socrates is a teapot. Checker stamps it REJECTED in red.</title>
        <path class="ln thin" d="M20 210 L620 210" stroke-dasharray="2 9"/>
        <g>
          <path class="skyf" d="M60 120 C60 96 76 86 96 86 C116 86 132 96 132 120 L132 200 L60 200 Z"/>
          <path class="paperf" d="M50 84 L142 84 L130 72 L120 46 L72 46 L62 72 Z"/>
          <path class="ln" d="M78 112 L92 112 M102 112 L116 112"/>
          <path class="ln thin" d="M86 140 Q96 134 106 140"/>
          <path class="ln" d="M132 150 L188 160"/>
        </g>
        <g transform="translate(196 112) rotate(4)">
          <rect class="paperf" x="0" y="0" width="190" height="84" rx="3"/>
          <text class="mono" x="14" y="30" font-size="13">type('socrates',</text>
          <text class="mono" x="14" y="52" font-size="13">     'teapot')</text>
          <text class="hand" x="14" y="74" font-size="15">trust me, it follows</text>
        </g>
        <g transform="translate(232 128) rotate(-12)">
          <rect class="nol" x="0" y="0" width="150" height="46" rx="4"/>
          <text class="handno" x="75" y="33" font-size="28" text-anchor="middle">REJECTED</text>
        </g>
        <use href="#checker" x="450" y="60" width="130" height="152"/>
        <path class="ln" d="M470 140 L404 150"/><rect class="paperf" x="380" y="138" width="26" height="30" rx="3"/>
        <path class="paperf" d="M470 14 L626 14 Q634 14 634 22 L634 50 Q634 58 626 58 L560 58 L548 72 L548 58 L470 58 Q462 58 462 50 L462 22 Q462 14 470 14 Z"/>
        <text class="hand" x="548" y="43" font-size="17" text-anchor="middle">Rule number, please?</text>
      </svg>
